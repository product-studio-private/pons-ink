[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
skip = ["src/v2/testing/**"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-hooks-public/=lib/v4-hooks-public/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
ink = "${INK_RPC_URL}"
ink_sepolia = "${INK_SEPOLIA_RPC_URL}"

[etherscan]
ink = { key = "${INK_EXPLORER_API_KEY}", url = "https://explorer.inkonchain.com/api", chain = 57073 }
ink_sepolia = { key = "${INK_EXPLORER_API_KEY}", url = "https://explorer-sepolia.inkonchain.com/api", chain = 763373 }
